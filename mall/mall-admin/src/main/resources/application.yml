server:
  port: 8080

spring:
  application:
    name: mall-admin
  datasource:
    url: jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
    elasticsearch:
      repositories:
        enabled: true
  elasticsearch:
    uris: http://localhost:9200
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: correlated
    publisher-returns: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.mall.mbg.model
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleteStatus
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET:mall-shop-secret-key-2026-for-jwt-token-signing-must-be-at-least-256-bits-long-for-hmac-sha}
  expiration: 28800000
  tokenHead: "Bearer "

minio:
  endpoint: http://localhost:9000
  accessKey: minioadmin
  secretKey: minioadmin
  bucketName: mall

alipay:
  appId: ${ALIPAY_APP_ID:}
  merchantPrivateKey: ${ALIPAY_MERCHANT_PRIVATE_KEY:}
  alipayPublicKey: ${ALIPAY_PUBLIC_KEY:}
  gatewayUrl: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  notifyUrl: ${ALIPAY_NOTIFY_URL:http://localhost:8080/api/oms/pay/callback}
  returnUrl: ${ALIPAY_RETURN_URL:http://localhost:5173/pay/result}
  signType: RSA2
  charset: utf-8
  format: json

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.mall: debug
